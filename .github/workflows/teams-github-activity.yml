
name: OceanGuard AI - GitHub Activity to Teams

on:
  push:
    branches:
      - '**'

  pull_request:
    types: [opened, reopened, closed]

  issues:
    types: [opened]

  create:

  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Send Professional Adaptive Card to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from urllib.parse import quote

          webhook = os.environ.get("TEAMS_WEBHOOK_URL")
          if not webhook:
              raise RuntimeError("TEAMS_WEBHOOK_URL secret is missing")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          name = os.environ["EVENT_NAME"]
          repo = os.environ["REPOSITORY"]
          repo_url = "https://github.com/" + repo

          title = ""
          subtitle = ""
          facts = []
          url = repo_url
          color = "Accent"

          def add(key, value):
              facts.append({
                  "title": key,
                  "value": str(value if value is not None else "-")
              })

          def date(value):
              if not value:
                  return "-"
              return value.replace("T", " ").replace("Z", " UTC")

          add("Repository", repo)

          # ===================================
          # 1. NEW COMMITS / PUSH
          # ===================================
          if name == "push":
              if event.get("deleted"):
                  print("Deleted ref: skipping notification")
                  raise SystemExit(0)

              branch = event.get("ref", "").replace("refs/heads/", "")
              commits = event.get("commits", [])
              head = event.get("head_commit") or {}

              title = "New Commits Pushed"
              subtitle = f"{len(commits)} commit(s) pushed to {branch}"
              color = "Good"

              add("Branch", branch)
              add("Pushed By", event.get("pusher", {}).get("name"))
              add("Commit Count", len(commits))

              if head:
                  add("Latest Commit", head.get("id", "")[:7])
                  add("Message", (head.get("message") or "")[:400])
                  url = head.get("url") or event.get("compare") or repo_url
              else:
                  url = event.get("compare") or repo_url

          # ===================================
          # 2. PULL REQUESTS
          # ===================================
          elif name == "pull_request":
              pr = event["pull_request"]
              action = event["action"]
              merged = pr.get("merged", False)

              if action == "closed" and merged:
                  title = "Pull Request Merged"
                  subtitle = f"Pull request #{pr['number']} has been merged"
                  color = "Good"
                  status = "🟣 Merged"

              elif action == "closed":
                  title = "Pull Request Closed"
                  subtitle = f"Pull request #{pr['number']} closed without merge"
                  color = "Attention"
                  status = "🔴 Closed"

              else:
                  title = "New Pull Request"
                  subtitle = f"Pull request #{pr['number']} is open"
                  color = "Accent"
                  status = "🔵 Open"

              add("Title", pr.get("title"))
              add("PR Number", pr.get("number"))
              add("Author", pr.get("user", {}).get("login"))
              add("Status", status)
              add("Source Branch", pr.get("head", {}).get("ref"))
              add("Target Branch", pr.get("base", {}).get("ref"))
              add("Created", date(pr.get("created_at")))
              add("Last Updated", date(pr.get("updated_at")))

              if merged:
                  add("Merged By", (pr.get("merged_by") or {}).get("login"))
                  add("Merged At", date(pr.get("merged_at")))

              url = pr.get("html_url") or repo_url

          # ===================================
          # 3. NEW ISSUES
          # ===================================
          elif name == "issues":
              issue = event["issue"]

              title = "New Issue Created"
              subtitle = f"Issue #{issue['number']} has been opened"
              color = "Warning"

              add("Issue Number", issue.get("number"))
              add("Title", issue.get("title"))
              add("Author", issue.get("user", {}).get("login"))
              add("Status", "🟡 Open")
              add("Created", date(issue.get("created_at")))

              url = issue.get("html_url") or repo_url

          # ===================================
          # 4. NEW BRANCH
          # ===================================
          elif name == "create":
              if event.get("ref_type") != "branch":
                  print("Not a branch creation; skipping")
                  raise SystemExit(0)

              branch = event.get("ref", "")

              title = "New Branch Created"
              subtitle = f"Branch {branch} created"
              color = "Accent"

              add("Branch", branch)
              add("Created By", event.get("sender", {}).get("login"))
              add("Default Branch", event.get("master_branch"))

              url = repo_url + "/tree/" + quote(branch, safe="/")

          # ===================================
          # 5. NEW RELEASE
          # ===================================
          elif name == "release":
              release = event["release"]

              title = "New Release Published"
              subtitle = release.get("name") or release.get("tag_name", "")
              color = "Good"

              add("Release", release.get("name"))
              add("Tag", release.get("tag_name"))
              add("Author", release.get("author", {}).get("login"))
              add("Published", date(release.get("published_at")))

              url = release.get("html_url") or repo_url

          # ===================================
          # 6. MANUAL TEST
          # ===================================
          elif name == "workflow_dispatch":
              title = "OceanGuard AI Test Notification"
              subtitle = "GitHub Actions webhook test successful"
              color = "Good"

              add("Status", "✅ Test Run")
              add("Timestamp", datetime.now(timezone.utc).isoformat())

              url = repo_url + "/actions"

          else:
              print("Unsupported event:", name)
              raise SystemExit(0)

          # ===================================
          # 7. PROFESSIONAL CARD DESIGN
          # ===================================

          icons = {
              "Repository": "📦",
              "Branch": "🌿",
              "Pushed By": "👤",
              "Commit Count": "📊",
              "Latest Commit": "🔖",
              "Message": "📝",
              "Title": "📑",
              "PR Number": "🆔",
              "Author": "👤",
              "Status": "📊",
              "Source Branch": "🌿",
              "Target Branch": "🎯",
              "Created": "📅",
              "Last Updated": "🔄",
              "Merged By": "👤",
              "Merged At": "✅",
              "Issue Number": "🟡",
              "Created By": "👤",
              "Default Branch": "🌳",
              "Release": "🚀",
              "Tag": "🏷️",
              "Published": "📅",
              "Timestamp": "🕒"
          }

          titles = {
              "New Commits Pushed": "🟢 New Commits Pushed",
              "New Pull Request": "🔵 New Pull Request",
              "Pull Request Merged": "✅ Pull Request Merged",
              "Pull Request Closed": "🔴 Pull Request Closed",
              "New Branch Created": "🌿 New Branch Created",
              "New Issue Created": "🟡 New Issue Created",
              "New Release Published": "🚀 New Release Published",
              "OceanGuard AI Test Notification": "✅ OceanGuard AI Test Notification"
          }

          # Create icon + bold label + value rows
          rows = []

          for item in facts:
              key = item["title"]
              value = item["value"]
              symbol = icons.get(key, "📌")

              rows.append({
                  "type": "ColumnSet",
                  "spacing": "Small",
                  "columns": [
                      {
                          "type": "Column",
                          "width": "40%",
                          "items": [{
                              "type": "TextBlock",
                              "text": f"{symbol}  {key}",
                              "weight": "Bolder",
                              "wrap": True,
                              "size": "Default"
                          }]
                      },
                      {
                          "type": "Column",
                          "width": "60%",
                          "items": [{
                              "type": "TextBlock",
                              "text": str(value),
                              "wrap": True,
                              "size": "Default"
                          }]
                      }
                  ]
              })

          # ===================================
          # 8. CREATE ADAPTIVE CARD
          # ===================================

          card = {
              "type": "message",
              "attachments": [{
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "contentUrl": None,
                  "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.2",
                      "body": [
                          {
                              "type": "TextBlock",
                              "text": titles.get(title, title),
                              "size": "Large",
                              "weight": "Bolder",
                              "color": color,
                              "wrap": True
                          },
                          {
                              "type": "TextBlock",
                              "text": subtitle,
                              "weight": "Bolder",
                              "wrap": True,
                              "spacing": "Medium"
                          },
                          {
                              "type": "Container",
                              "spacing": "Medium",
                              "items": rows
                          },
                          {
                              "type": "TextBlock",
                              "text": "Automatically generated by OceanGuard AI GitHub Actions",
                              "size": "Small",
                              "isSubtle": True,
                              "wrap": True,
                              "separator": True,
                              "spacing": "Medium"
                          }
                      ],
                      "actions": [{
                          "type": "Action.OpenUrl",
                          "title": "View on GitHub",
                          "url": url
                      }]
                  }
              }]
          }

          # ===================================
          # 9. SEND CARD TO MICROSOFT TEAMS
          # ===================================

          payload = json.dumps(
              card,
              ensure_ascii=False
          ).encode("utf-8")

          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  print("Teams webhook status:", response.status)
                  print("Event:", name)
                  print("Notification:", title)

          except urllib.error.HTTPError as error:
              print("Teams webhook HTTP error:", error.code)
              print(
                  error.read()
                  .decode("utf-8", errors="replace")[:1000]
              )
              raise

          PY
